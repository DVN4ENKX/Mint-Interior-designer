server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # фото подложки и "3D из фото" могут быть тяжёлыми
    client_max_body_size 25m;

    # сервис реконструкции TripoSR (browser -> nginx -> reconstructor)
    location /api/reconstruct {
        proxy_pass http://reconstructor:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # генерация на CPU занимает минуты — не ждать по умолчанию 60 с
        proxy_read_timeout 900s;
        proxy_send_timeout 300s;
    }

    # API-сервер (auth, проекты)
    location /api/ {
        proxy_pass http://server:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA: любой маршрут отдаёт index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # модели и картинки кэшируем надолго
    location ~* \.(glb|gltf|png|jpg|jpeg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json model/gltf-binary;
}
